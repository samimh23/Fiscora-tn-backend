steps:
  - name: python:3.12-slim-bookworm
    entrypoint: python
    args: [-m, pip, install, --target=/workspace/publish-deps, huggingface-hub==1.33.0, google-cloud-storage==3.4.1]
  - name: python:3.12-slim-bookworm
    entrypoint: python
    args: [-u, cloud_publish.py]
    env:
      - PYTHONPATH=/workspace/publish-deps
      - HF_HOME=/workspace/private-hf-cache
      - HF_XET_CHUNK_CACHE_SIZE_BYTES=0
      - HF_HUB_DISABLE_PROGRESS_BARS=1
    secretEnv: [HF_TOKEN]
availableSecrets:
  secretManager:
    - versionName: ${_HF_SECRET_VERSION}
      env: HF_TOKEN
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
timeout: 1800s
