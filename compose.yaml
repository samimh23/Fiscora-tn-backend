services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: accounting_nest
      POSTGRES_USER: accounting
      POSTGRES_PASSWORD: accounting_dev
    ports:
      - "5435:5432"
    volumes:
      - accounting_nest_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accounting -d accounting_nest"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - accounting_nest_minio:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  clamav:
    image: clamav/clamav:1.4
    volumes:
      - accounting_nest_clamav_signatures:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  api:
    build: .
    environment:
      PORT: 3000
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: accounting
      DB_PASSWORD: accounting_dev
      DB_NAME: accounting_nest
      DB_MIGRATIONS_RUN: "true"
      JWT_SIGNING_KEY: DEVELOPMENT-NESTJS-DO-NOT-USE-IN-PRODUCTION-CHANGE-ME-1234567890
      JWT_ISSUER: accounting-platform
      JWT_AUDIENCE: accounting-platform-api
      JWT_ACCESS_MINUTES: 30
      JWT_REFRESH_DAYS: 14
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_ENDPOINT: localhost
      MINIO_PUBLIC_PORT: 9000
      MINIO_PUBLIC_USE_SSL: "false"
      MINIO_REGION: us-east-1
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: accounting-documents
      MALWARE_SCAN_ENABLED: "true"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      CLAMAV_TIMEOUT_MS: 30000
      APP_PUBLIC_URL: http://127.0.0.1:5173
      INVITATION_EXPOSE_LINK: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SMTP_FROM: Fiscora <invitations@fiscora.local>
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      mailpit:
        condition: service_started
      clamav:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - accounting_nest_prometheus:/prometheus
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-fiscora_dev}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL: ""
    ports:
      - "3001:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - accounting_nest_grafana:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  accounting_nest_postgres:
  accounting_nest_minio:
  accounting_nest_clamav_signatures:
  accounting_nest_prometheus:
  accounting_nest_grafana:
