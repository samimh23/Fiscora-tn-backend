name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      bootstrap_image_only:
        description: Build and push the first backend image without updating a Container App
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: fiscora_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fiscora_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Validate backend hosting selection
        env:
          BACKEND_HOSTING: ${{ vars.AZURE_BACKEND_HOSTING }}
        run: |
          case "$BACKEND_HOSTING" in
            ""|container-app|app-service) ;;
            *) echo "Invalid AZURE_BACKEND_HOSTING; deployment is blocked." >&2; exit 1 ;;
          esac

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Check first-deployment workflow guards
        run: node --test scripts/deployment-workflows.test.cjs

      - name: Build application
        run: npm run build

      - name: Verify all migrations on disposable PostgreSQL
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: ci_test_only
          DB_NAME: fiscora_migration_test
          DB_SSL: 'false'
        run: |
          npm run migration:run
          node scripts/verify-workflow-migration.cjs
          node scripts/verify-dossier-deletion.cjs

      - name: Build production container
        run: docker build --tag fiscora-backend:${{ github.sha }} .

  deploy-staging:
    name: Deploy validated backend to staging
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (vars.AZURE_BACKEND_HOSTING == '' || vars.AZURE_BACKEND_HOSTING == 'container-app')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-azure-staging.yml
    with:
      update_container_app: ${{ inputs.bootstrap_image_only != true }}

  deploy-app-service:
    name: Deploy validated backend to App Service after cutover
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AZURE_BACKEND_HOSTING == 'app-service'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-azure-app-service.yml
    with:
      update_app_service: ${{ inputs.bootstrap_image_only != true }}
