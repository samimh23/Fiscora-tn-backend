name: Deploy backend to Azure staging

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-backend-azure-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, deploy and verify immutable backend image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure Container Registry
        run: az acr login --name "${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}"

      - name: Build and push backend image
        env:
          IMAGE: ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/fiscora-backend:${{ github.sha }}
        run: |
          docker build --platform linux/amd64 --tag "$IMAGE" .
          docker push "$IMAGE"

      - name: Resolve immutable image digest
        id: image
        shell: bash
        run: |
          digest="$(az acr repository show \
            --name "${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}" \
            --image "fiscora-backend:${{ github.sha }}" \
            --query digest --output tsv)"
          image="${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/fiscora-backend@$digest"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Use this immutable value for Terraform's backend_image:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy the exact image revision
        run: >-
          az containerapp update
          --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"
          --name "${{ vars.AZURE_CONTAINER_APP_NAME }}"
          --image "${{ steps.image.outputs.image }}"
          --output none

      - name: Verify the deployed API
        shell: bash
        env:
          CONFIGURED_API_URL: ${{ vars.AZURE_API_URL }}
        run: |
          api_url="${CONFIGURED_API_URL%/}"
          if [ -z "$api_url" ]; then
            hostname="$(az containerapp show \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
              --query properties.configuration.ingress.fqdn \
              --output tsv)"
            api_url="https://$hostname"
          fi

          echo "Waiting for $api_url/health"
          curl --fail --show-error --silent \
            --retry 18 --retry-delay 10 --retry-all-errors \
            "$api_url/health"
