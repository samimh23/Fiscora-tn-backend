name: Deploy backend to Azure staging

on:
  workflow_call:
    inputs:
      update_container_app:
        description: False builds the bootstrap image only; Terraform creates the first Container App
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-backend-azure-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, deploy and verify immutable backend image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure Container Registry
        run: az acr login --name "${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}"

      - name: Build and push backend image
        env:
          IMAGE: ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/fiscora-backend:${{ github.sha }}
        run: |
          docker build --platform linux/amd64 --build-arg APP_RELEASE_SHA="${{ github.sha }}" --tag "$IMAGE" .
          docker push "$IMAGE"

      - name: Resolve immutable image digest
        id: image
        shell: bash
        run: |
          digest="$(az acr repository show \
            --name "${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}" \
            --image "fiscora-backend:${{ github.sha }}" \
            --query digest --output tsv)"
          image="${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/fiscora-backend@$digest"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Use this immutable value for Terraform's backend_image:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.update_container_app }}" != "true" ]; then
            echo "Image-only bootstrap: no Container App was updated. Review a Terraform plan with deploy_application=true and this digest to create the API." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy the exact image revision
        if: inputs.update_container_app
        run: >-
          az containerapp update
          --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"
          --name "${{ vars.AZURE_CONTAINER_APP_NAME }}"
          --container-name api
          --image "${{ steps.image.outputs.image }}"
          --output none

      - name: Wait for the exact image revision to become healthy
        if: inputs.update_container_app
        shell: bash
        env:
          EXPECTED_IMAGE: ${{ steps.image.outputs.image }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP_NAME }}
        run: |
          for attempt in $(seq 1 30); do
            revision="$(az containerapp show --resource-group "$RESOURCE_GROUP" \
              --name "$CONTAINER_APP" --query properties.latestRevisionName --output tsv)"
            ready="$(az containerapp show --resource-group "$RESOURCE_GROUP" \
              --name "$CONTAINER_APP" --query properties.latestReadyRevisionName --output tsv)"
            if [ -n "$revision" ] && [ "$revision" = "$ready" ]; then
              actual_image="$(az containerapp revision show --resource-group "$RESOURCE_GROUP" \
                --name "$CONTAINER_APP" --revision "$revision" \
                --query "properties.template.containers[?name=='api'].image | [0]" --output tsv)"
              health="$(az containerapp revision show --resource-group "$RESOURCE_GROUP" \
                --name "$CONTAINER_APP" --revision "$revision" \
                --query properties.healthState --output tsv)"
              if [ "$actual_image" = "$EXPECTED_IMAGE" ] && [ "$health" = Healthy ]; then
                echo "Verified healthy revision $revision for $EXPECTED_IMAGE"
                exit 0
              fi
            fi
            echo "Waiting for the exact backend image to be ready (attempt $attempt/30)"
            sleep 10
          done
          echo "The expected backend image did not become the latest healthy revision." >&2
          exit 1

      - name: Verify the deployed API
        if: inputs.update_container_app
        shell: bash
        env:
          CONFIGURED_API_URL: ${{ vars.AZURE_API_URL }}
        run: |
          api_url="${CONFIGURED_API_URL%/}"
          if [ -z "$api_url" ]; then
            hostname="$(az containerapp show \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
              --query properties.configuration.ingress.fqdn \
              --output tsv)"
            api_url="https://$hostname"
          fi

          echo "Waiting for $api_url/health"
          curl --fail --show-error --silent \
            --retry 18 --retry-delay 10 --retry-all-errors \
            "$api_url/health"
